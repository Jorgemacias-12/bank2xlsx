name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Zip Release
        run: Compress-Archive `
          -Path bin/Release/net9.0-windows/win-x64/publish/Bank2Pdf.exe `
          -DestinationPath Bank2Pdf.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net9.0-windows/win-x64/publish/Bank2Pdf.exe
            Bank2Pdf.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}